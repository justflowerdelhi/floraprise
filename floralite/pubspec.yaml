name: floraprise
description: Floraprise florist management app
publish_to: 'none'
version: 1.0.2+3

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  flutter_localizations:
    sdk: flutter
  provider: ^6.1.2
  intl: any
  sqflite: ^2.3.3+1
  path: ^1.9.0
  image_picker: ^1.1.2
  url_launcher: ^6.3.1
  file_selector: ^1.0.3
  csv: ^6.0.0
  excel: ^2.1.0
  path_provider: ^2.1.4
  permission_handler: ^11.3.1
  mobile_scanner: ^5.2.3
  flutter_svg: ^2.0.10
  google_fonts: ^6.2.1
  razorpay_flutter: ^1.3.0
  flutter_secure_storage: ^10.3.1
  package_info_plus: ^8.0.0
  flutter_native_contact_picker: 0.0.12
  share_plus: ^10.0.2
  image: ^4.2.0
  speech_to_text: ^7.4.0
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  web_socket_channel: ^3.0.3
  flutter_local_notifications: ^18.0.1
  timezone: ^0.9.4
  flutter_timezone: ^4.1.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0
  flutter_launcher_icons: ^0.14.3
  flutter_native_splash: ^2.4.1

dependency_overrides:
  objective_c: 9.1.0

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/logo/
    - assets/icon.png
    - assets/splash_icon.png

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icon.png
  remove_alpha_ios: true
  min_sdk_android: 21
  web:
    generate: true
    image_path: assets/icon.png
    background_color: "#ffffff"
    theme_color: "#ffffff"
  windows:
    generate: true
    image_path: assets/icon.png
    icon_size: 48
  macos:
    generate: true
    image_path: assets/icon.png

flutter_native_splash:
  color: "#062F25"
  image: assets/splash_icon.png
  android_gravity: center
  ios_content_mode: center
  web_image_mode: contain
  android: true
  ios: true
  web: true
  android_12:
    color: "#062F25"
    image: assets/splash_icon.png
