  <style id="splash-screen-style">
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #062F25;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    #splash {
      position: fixed;
      inset: 0;
      z-index: 999999;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at 50% 42%, #0D4638 0%, #062F25 65%, #041F19 100%);
      opacity: 1;
      visibility: visible;
      transition: opacity 0.4s cubic-bezier(0.16, 1, 0.3, 1), visibility 0.4s ease;
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
    }

    #splash.fade-out {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .botanical-bg {
      position: absolute;
      pointer-events: none;
      opacity: 0.045;
      width: 320px;
      height: 240px;
    }

    .botanical-tl {
      top: -30px;
      left: -30px;
      transform: rotate(-15deg);
    }

    .botanical-br {
      bottom: -30px;
      right: -30px;
      transform: rotate(165deg);
    }

    .splash-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      max-width: 480px;
      padding: 0 24px;
      animation: splashEntrance 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes splashEntrance {
      from {
        opacity: 0;
        transform: translateY(10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .logo-container {
      position: relative;
      width: 120px;
      height: 120px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .floraprise-mark {
      width: 120px;
      height: 120px;
      display: block;
      filter: drop-shadow(0 4px 16px rgba(0, 0, 0, 0.25));
    }

    .brand-title {
      font-size: 32px;
      font-weight: 600;
      letter-spacing: 2px;
      color: #FFFFFF;
      margin: 22px 0 0 0;
      line-height: 1.2;
    }

    .edition-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-top: 10px;
      padding: 4px 14px;
      border-radius: 20px;
      background: rgba(229, 184, 50, 0.12);
      border: 1px solid rgba(229, 184, 50, 0.35);
      color: #E5B832;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 2.2px;
      text-transform: uppercase;
    }

    .edition-badge svg {
      width: 12px;
      height: 12px;
      fill: currentColor;
    }

    .brand-tagline {
      margin: 16px 0 0 0;
      font-size: 15px;
      font-weight: 300;
      letter-spacing: 0.5px;
      color: rgba(255, 255, 255, 0.76);
      line-height: 1.4;
    }

    .brand-divider {
      width: 44px;
      height: 1px;
      background: rgba(255, 255, 255, 0.16);
      margin: 24px auto 20px auto;
    }

    .loading-status {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }

    .status-text {
      font-size: 13px;
      font-weight: 400;
      letter-spacing: 0.3px;
      color: rgba(255, 255, 255, 0.52);
    }

    .loading-dots {
      display: flex;
      gap: 8px;
      align-items: center;
      justify-content: center;
    }

    .loading-dots .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #E5B832;
      animation: dotPulse 1.4s ease-in-out infinite;
    }

    .loading-dots .dot:nth-child(2) {
      animation-delay: 0.25s;
    }

    .loading-dots .dot:nth-child(3) {
      animation-delay: 0.5s;
    }

    @keyframes dotPulse {
      0%, 100% {
        opacity: 0.25;
        transform: scale(0.85);
      }
      50% {
        opacity: 0.95;
        transform: scale(1.2);
      }
    }

    @media (max-width: 600px), (max-height: 550px) {
      .logo-container, .floraprise-mark {
        width: 96px;
        height: 96px;
      }
      .brand-title {
        font-size: 26px;
        margin-top: 16px;
      }
      .brand-tagline {
        font-size: 13px;
        margin-top: 12px;
      }
      .brand-divider {
        margin: 18px auto 16px auto;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .splash-content, .loading-dots .dot {
        animation: none !important;
      }
      #splash {
        transition: none !important;
      }
    }
  </style>

  <script id="splash-screen-script">
    function removeSplashFromWeb() {
      const splash = document.getElementById("splash");
      if (splash && !splash.classList.contains("fade-out")) {
        splash.classList.add("fade-out");
        setTimeout(function() {
          splash.remove();
          document.body.style.background = "transparent";
        }, 400);
      }
    }

    // Auto-dismiss once Flutter initializes and mounts its root view
    (function() {
      let dismissed = false;
      function checkAndDismiss() {
        if (dismissed) return;
        const fltView = document.querySelector('flutter-view') || document.querySelector('flt-glass-pane');
        if (fltView) {
          dismissed = true;
          window.requestAnimationFrame(function() {
            setTimeout(removeSplashFromWeb, 150);
          });
        }
      }

      const observer = new MutationObserver(function() {
        checkAndDismiss();
      });

      if (document.body) {
        observer.observe(document.body, { childList: true, subtree: true });
      } else {
        document.addEventListener('DOMContentLoaded', function() {
          observer.observe(document.body, { childList: true, subtree: true });
        });
      }

      // Safety timeout: dismiss if observer doesn't fire after 4.5 seconds
      setTimeout(removeSplashFromWeb, 4500);
    })();
  </script>
</head>
