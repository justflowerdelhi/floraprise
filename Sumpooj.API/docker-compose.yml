version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: floraprise-db
    environment:
      POSTGRES_DB: FloristERP
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: floraprise-api
    ports:
      - "8080:8080"
      - "8443:8443"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__Default=Host=postgres;Port=5432;Database=FloristERP;Username=postgres;Password=postgres123
      - Jwt__Key=Thisissecure-local-sumpooj-florist-erp-key-9990
      - Jwt__Issuer=Sumpooj.API
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres-data:
