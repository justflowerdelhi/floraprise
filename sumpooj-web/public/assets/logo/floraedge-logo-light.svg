<svg width="180" height="40" viewBox="0 0 180 40" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Flower Icon - Light version for dark backgrounds -->
  <g id="flower-icon">
    <circle cx="20" cy="20" r="3" fill="#F4C430"/>
    <ellipse cx="20" cy="12" rx="4" ry="6" fill="#4CAF50" opacity="0.9"/>
    <ellipse cx="28" cy="20" rx="6" ry="4" fill="#4CAF50" opacity="0.9"/>
    <ellipse cx="20" cy="28" rx="4" ry="6" fill="#4CAF50" opacity="0.9"/>
    <ellipse cx="12" cy="20" rx="6" ry="4" fill="#4CAF50" opacity="0.9"/>
    <ellipse cx="25" cy="15" rx="4.5" ry="5" transform="rotate(45 25 15)" fill="#4CAF50" opacity="0.8"/>
    <ellipse cx="25" cy="25" rx="4.5" ry="5" transform="rotate(-45 25 25)" fill="#4CAF50" opacity="0.8"/>
    <ellipse cx="15" cy="15" rx="4.5" ry="5" transform="rotate(-45 15 15)" fill="#4CAF50" opacity="0.8"/>
    <ellipse cx="15" cy="25" rx="4.5" ry="5" transform="rotate(45 15 25)" fill="#4CAF50" opacity="0.8"/>
  </g>
  
  <!-- FloraEdge Text - White for dark backgrounds -->
  <text x="45" y="27" font-family="Inter, system-ui, sans-serif" font-size="20" font-weight="700" fill="#FFFFFF">
    Flora<tspan fill="#4CAF50">Edge</tspan>
  </text>
</svg>
